services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pockt-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - COOKIE_SECRET=pockt-prod-secret-change-this-987
    volumes:
      - pockt-db-data:/app/apps/backend/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pockt-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  pockt-db-data:
